<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Garden Relay</title><style>*{box-sizing:border-box}body{margin:0;background:#101d28;color:#f4f2dc;font:16px system-ui;text-align:center;padding:18px}h1{font-size:22px;margin:0 0 8px}p{color:#aabcc4;font-size:13px}button{border:0;border-radius:8px;padding:10px 20px;background:#d7f783;color:#17232a;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid white;outline-offset:3px}.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.mode{background:#263944;color:#f4f2dc}.mode[aria-pressed="true"]{background:#d7f783;color:#17232a}#board{display:grid;gap:9px;max-width:350px;margin:20px auto}.tile{aspect-ratio:1;padding:0;font-size:30px;background:#263944;color:#729190}.tile.on{background:#d7f783;color:#244034}.counters{display:flex;gap:18px;justify-content:center;font-weight:700}#status{min-height:1.4em;margin-top:8px;color:#d7f783}footer{margin-top:24px;font-size:12px;color:#aabcc4}</style></head><body><h1>Signal Garden Relay</h1><p>Light the whole grid. Every tile changes itself and its horizontal and vertical neighbours.</p><div class="row" role="group" aria-label="Mode"><button class="mode" id="mode3" type="button" aria-pressed="false">Training 3×3</button><button class="mode" id="mode5" type="button" aria-pressed="true">Standard 5×5</button></div><div class="counters"><span>Moves: <output id="moves">0</output></span><span>Lit: <output id="lit">0/25</output></span></div><div id="board" role="group" aria-label="Signal grid"></div><div id="status" aria-live="polite"></div><div class="row"><button id="undo" type="button">Undo move</button><button id="restart" type="button">Restart puzzle</button><button id="reset" type="button">New puzzle</button></div><footer>Signal Garden by Game Commons (MIT). Remixed by Claude Code for Captain / Game Commons from Signal Garden v1.</footer><script>
let size=5,cells=[],start=[],moves=0,history=[];const board=document.getElementById('board'),status=document.getElementById('status'),movesOut=document.getElementById('moves'),litOut=document.getElementById('lit'),undoBtn=document.getElementById('undo'),mode3=document.getElementById('mode3'),mode5=document.getElementById('mode5');let tiles=[];
function flip(i){const r=Math.floor(i/size),c=i%size;[i,r>0?i-size:-1,r<size-1?i+size:-1,c>0?i-1:-1,c<size-1?i+1:-1].filter(n=>n>=0).forEach(n=>cells[n]=!cells[n])}
function build(){board.replaceChildren();board.style.gridTemplateColumns='repeat('+size+',1fr)';tiles=cells.map((_,i)=>{let b=document.createElement('button');b.type='button';b.className='tile';b.onclick=()=>move(i);board.append(b);return b})}
function draw(){const lit=cells.filter(Boolean).length,solved=lit===cells.length;cells.forEach((on,i)=>{const b=tiles[i];b.textContent=on?'✦':'·';b.classList.toggle('on',on);b.disabled=solved;b.setAttribute('aria-label','Row '+(Math.floor(i/size)+1)+', column '+(i%size+1)+(on?', lit':', dark'))});movesOut.textContent=moves;litOut.textContent=lit+'/'+cells.length;status.textContent=solved?'Garden restored in '+moves+' moves!':'';undoBtn.disabled=history.length===0;mode3.setAttribute('aria-pressed',size===3);mode5.setAttribute('aria-pressed',size===5)}
function move(i){history.push({cells:cells.slice(),moves});flip(i);moves++;draw()}
function undo(){const prev=history.pop();if(!prev)return;cells=prev.cells;moves=prev.moves;draw()}
function restart(){cells=start.slice();moves=0;history=[];draw()}
// Scramble with legal moves from the solved board so every puzzle is solvable.
function reset(){cells=Array(size*size).fill(true);moves=0;history=[];const n=size===3?5:12;for(let i=0;i<n;i++)flip(Math.floor(Math.random()*cells.length));if(cells.every(Boolean))flip(Math.floor(cells.length/2));start=cells.slice();build();draw()}
function setMode(s){size=s;reset()}
undoBtn.onclick=undo;document.getElementById('restart').onclick=restart;document.getElementById('reset').onclick=reset;mode3.onclick=()=>setMode(3);mode5.onclick=()=>setMode(5);reset();
</script></body></html>
