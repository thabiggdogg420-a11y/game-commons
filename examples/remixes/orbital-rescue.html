<!-- Orbital Rescue: shield, rescue and pause mechanics by ChatGPT for Game Commons. Derived from Orbital Drift v1. -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital Rescue</title><style>*{box-sizing:border-box}body{margin:0;background:#101d28;color:#f4f2dc;font:16px system-ui;text-align:center;padding:18px}h1{font-size:22px;margin:0 0 8px}p{color:#aabcc4;font-size:13px}button{border:0;border-radius:8px;padding:10px 20px;background:#d7f783;color:#17232a;font-weight:700;cursor:pointer}canvas{display:block;width:100%;max-width:600px;margin:12px auto;border-radius:12px;touch-action:none}button:focus-visible{outline:3px solid white;outline-offset:3px}</style></head><body><h1>Orbital Rescue</h1><p>Rescue the cyan pods. Survive 45 seconds with three shields.</p><button id="start">Start mission</button> <button id="pause" disabled>Pause</button><canvas id="game" width="600" height="400" aria-label="Asteroid rescue game"></canvas><p>Move with arrow keys, your pointer, or a finger. Space pauses.</p><div id="status" aria-live="polite">Ready for launch</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status');
let x=300,rocks=[],pods=[],running=false,paused=false,elapsed=0,prev=0,spawn=0,podTimer=0,keys={},shields=3,rescued=0,invulnerable=0;
const start=document.getElementById('start'),pause=document.getElementById('pause');
function move(e){const r=c.getBoundingClientRect();x=Math.max(15,Math.min(585,(e.clientX-r.left)*600/r.width))}
c.onpointermove=move;c.onpointerdown=e=>{move(e);c.setPointerCapture(e.pointerId)};
onkeydown=e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&!e.repeat)togglePause();else keys[e.key]=true};
onkeyup=e=>keys[e.key]=false;
onblur=()=>{keys={};if(running&&!paused)togglePause()};
function togglePause(){if(!running)return;paused=!paused;pause.textContent=paused?'Resume':'Pause';status.textContent=paused?'Mission paused.': 'Rescue in progress.'}
pause.onclick=togglePause;
start.onclick=()=>{x=300;rocks=[];pods=[];elapsed=0;spawn=0;podTimer=0;running=true;paused=false;shields=3;rescued=0;invulnerable=0;keys={};status.textContent='Rescue in progress. Three shields online.';start.textContent='Restart mission';pause.disabled=false;pause.textContent='Pause'};
function finish(message){running=false;pause.disabled=true;status.textContent=message}
function frame(t){
 const dt=Math.min((t-prev)/1000,.04);prev=t;
 ctx.fillStyle='#101d28';ctx.fillRect(0,0,600,400);
 for(let i=0;i<55;i++){ctx.fillStyle=i%3?'#42616e':'#aecbd1';ctx.fillRect((i*137)%600,(i*79+elapsed*18)%400,2,2)}
 if(running&&!paused){
  elapsed+=dt;spawn+=dt;podTimer+=dt;invulnerable=Math.max(0,invulnerable-dt);
  x=Math.max(15,Math.min(585,x+((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*320*dt));
  if(spawn>.48){rocks.push({x:20+Math.random()*560,y:-20,r:10+Math.random()*13});spawn=0}
  if(podTimer>3){pods.push({x:25+Math.random()*550,y:-15});podTimer=0}
  for(const a of rocks){a.y+=(85+elapsed*1.5)*dt;if(invulnerable===0&&Math.hypot(x-a.x,350-a.y)<a.r+10){
   shields--;invulnerable=1.3;a.y=450;status.textContent='Impact! '+shields+' shields remaining.';
   if(shields===0){finish('Mission ended. Rescued '+rescued+' pods in '+elapsed.toFixed(1)+' seconds.');break}
  }}
  if(running)for(const p of pods){p.y+=105*dt;if(Math.hypot(x-p.x,350-p.y)<25){rescued++;p.y=450;status.textContent='Pod rescued! Total: '+rescued+'.'}}
  rocks=rocks.filter(a=>a.y<440);pods=pods.filter(p=>p.y<440);
  if(elapsed>=45&&running){elapsed=45;finish('Mission complete! '+rescued+' pods rescued, '+shields+' shields remaining.')}
 }
 for(const a of rocks){ctx.fillStyle='#e77d4f';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,7);ctx.fill();ctx.strokeStyle='#ffb083';ctx.stroke()}
 for(const p of pods){ctx.fillStyle='#72d7e8';ctx.fillRect(p.x-8,p.y-8,16,16);ctx.fillStyle='#101d28';ctx.fillRect(p.x-2,p.y-5,4,10);ctx.fillRect(p.x-5,p.y-2,10,4)}
 if(invulnerable===0||Math.floor(invulnerable*10)%2===0){
  ctx.fillStyle='#d7f783';ctx.beginPath();ctx.moveTo(x,335);ctx.lineTo(x-12,367);ctx.lineTo(x,360);ctx.lineTo(x+12,367);ctx.closePath();ctx.fill();
  if(shields>0){ctx.strokeStyle='#72d7e8';ctx.beginPath();ctx.arc(x,352,21,0,7);ctx.stroke()}
 }
 ctx.fillStyle='#d7e4e6';ctx.font='14px monospace';ctx.fillText('TIME '+elapsed.toFixed(1)+' / 45',16,24);ctx.fillText('SHIELDS '+shields+'   RESCUED '+rescued,320,24);
 if(paused){ctx.fillStyle='#101d28cc';ctx.fillRect(0,160,600,70);ctx.fillStyle='#d7f783';ctx.font='24px system-ui';ctx.fillText('MISSION PAUSED',195,204)}
 requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script></body></html>
